version: '3.8'

services:
  # 开发环境 - 所有应用并行运行
  mf-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"  # mf_app1
      - "3002:3002"  # mf_app2  
      - "3003:3003"  # mf_app3
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/mf_app1/node_modules
      - /app/packages/mf_app2/node_modules
      - /app/packages/mf_app3/node_modules
      - /app/shared/node_modules
    environment:
      - NODE_ENV=development
    command: pnpm dev
    networks:
      - mf-network

  # 生产环境 - nginx 服务所有应用
  mf-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    environment:
      - NODE_ENV=production
    networks:
      - mf-network

  # 独立的应用服务 (可选)
  mf-app1:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP_NAME: mf_app1
        PORT: 3001
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    networks:
      - mf-network

  mf-app2:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP_NAME: mf_app2
        PORT: 3002
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      - mf-app1
    networks:
      - mf-network

  mf-app3:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        APP_NAME: mf_app3
        PORT: 3003
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    depends_on:
      - mf-app1
    networks:
      - mf-network

networks:
  mf-network:
    driver: bridge